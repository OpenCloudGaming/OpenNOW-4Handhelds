[package]
name = "opennow-handheld"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "OpenNOW front end for handhelds without a window manager"

[dependencies]
jpeg-decoder = { version = "0.3", default-features = false }
libloading = "0.8"
png = "0.17"
resvg = { version = "0.45", default-features = false }
serde_json = "1"
swash = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Power"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
